<section id="home" class="hero-section">
  <!-- Hero Background Effects -->
  <div class="hero-bg">
    <div class="hero-gradient-sphere sphere-1"></div>
    <div class="hero-gradient-sphere sphere-2"></div>
    <div class="hero-gradient-sphere sphere-3"></div>
    <div class="floating-shapes">
      <div class="shape shape-1"></div>
      <div class="shape shape-2"></div>
      <div class="shape shape-3"></div>
      <div class="shape shape-4"></div>
    </div>
  </div>

  <!-- Hero Content -->
  <div class="hero-container">
    <div class="hero-content">
      <!-- Greeting Badge -->
      <div class="greeting-badge">
        <span class="greeting-wave">👋</span>
        <span class="greeting-text">{{ data.hero?.greeting }}</span>
      </div>

      <!-- Main Heading -->
      <div class="hero-heading">
        <h1 class="name">
          <span class="name-text">{{ data.personal?.name }}</span>
          <div class="name-glow"></div>
        </h1>
        <div class="title-container">
          <span class="title">{{ data.personal?.title }}</span>
          <div class="title-accent"></div>
        </div>
      </div>

      <!-- Description -->
      <div class="hero-description">
        <p class="description">{{ data.hero?.description }}</p>
        <div class="description-highlight"></div>
      </div>

      <!-- Action Buttons -->
      <div class="hero-actions">
        <button
          class="action-btn primary-btn"
          (click)="scrollToSection(data.hero?.primaryButton?.link.replace('#', ''))"
          [attr.aria-label]="data.hero?.primaryButton?.text">
          <span class="btn-text">{{ data.hero?.primaryButton?.text }}</span>
          <div class="btn-icon">
            <mat-icon>arrow_forward</mat-icon>
          </div>
          <div class="btn-glow"></div>
        </button>

        <button
          class="action-btn secondary-btn"
          (click)="scrollToSection(data.hero?.secondaryButton?.link.replace('#', ''))"
          [attr.aria-label]="data.hero?.secondaryButton?.text">
          <span class="btn-text">{{ data.hero?.secondaryButton?.text }}</span>
          <div class="btn-border"></div>
        </button>
      </div>

      <!-- Stats/Skills Preview -->
      <div class="hero-stats" *ngIf="data.about?.skills">
        <div class="stats-container">
          <div class="stat-item" *ngFor="let skill of data.about.skills.slice(0, 4); let i = index">
            <span class="stat-text">{{ skill }}</span>
            <div class="stat-dot" [style.animation-delay.ms]="i * 200"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Scroll Indicator -->
    <div class="scroll-indicator" (click)="scrollToSection('about')" [attr.aria-label]="'Scroll to About section'">
      <div class="scroll-mouse">
        <div class="scroll-wheel"></div>
      </div>
      <div class="scroll-text">Scroll Down</div>
      <div class="scroll-arrow">
        <mat-icon>keyboard_arrow_down</mat-icon>
      </div>
    </div>
  </div>

  <!-- Hero Pattern Overlay -->
  <div class="hero-pattern">
    <svg width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none">
      <defs>
        <pattern id="heroPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
          <circle cx="10" cy="10" r="1" fill="rgba(102, 126, 234, 0.1)"/>
          <circle cx="30" cy="30" r="0.5" fill="rgba(240, 147, 251, 0.08)"/>
        </pattern>
      </defs>
      <rect width="100%" height="100%" fill="url(#heroPattern)"/>
    </svg>
  </div>
</section>
